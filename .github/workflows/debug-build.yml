name: Debug APK Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Checkout flutter submodule full history
        run: |
          cd .flutter
          git fetch --unshallow || true
          cd ..

      - name: Add Flutter to PATH
        run: echo "$GITHUB_WORKSPACE/.flutter/bin" >> $GITHUB_PATH

      - run: flutter --version

      - run: flutter pub get

      - run: flutter build apk --debug --android-skip-build-dependency-validation --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: mhabit-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
